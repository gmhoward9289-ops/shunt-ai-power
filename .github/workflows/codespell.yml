name: Codespell

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2
        with:
          # ANE = Apple Neural Engine, fillIn = variable name in
          # calibrate.ps1, ND = abbreviation in the dashboard template.
          ignore_words_list: ane,fillin,nd
